<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Sitemap debresser.nl · per onderdeel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../css/tokens.css">
<style>
  @page { size: A4 landscape; margin: 0; }
  * { box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { margin: 0; font-family: var(--db-font); color: var(--db-antraciet); font-size: 9pt; line-height: 1.45; background: #fff; }
  h1, h2, h3, h4 { margin: 0; font-weight: 600; color: var(--db-nachtblauw); }
  p { margin: 0; }
  ul { margin: 0; padding: 0; list-style: none; }
  .mono { font-family: "IBM Plex Mono", Consolas, monospace; }
  svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  :root { --lijn: #AFBACB; }

  .page { width: 297mm; height: 210mm; padding: 10mm 12mm 8mm; display: flex; flex-direction: column; position: relative; overflow: hidden; break-after: page; }
  .page:last-child { break-after: auto; }

  .ph { display: flex; align-items: center; justify-content: space-between; padding-bottom: 7px; margin-bottom: 10px; border-bottom: 1px solid var(--db-mist); font-size: 8pt; color: var(--db-grijs); }
  .ph img { height: 22px; }
  .ph b { color: var(--db-nachtblauw); font-weight: 600; }
  .pf { margin-top: auto; padding-top: 7px; display: flex; justify-content: space-between; align-items: center; gap: 16px; font-size: 7.3pt; color: var(--db-grijs); border-top: 1px solid var(--db-mist); }

  .eyebrow { position: relative; display: inline-block; padding: 0 12px 6px 8px; color: var(--db-diepblauw); font-size: 7.5pt; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  .eyebrow::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 1.5px; background: currentColor; }
  .eyebrow::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: currentColor; clip-path: polygon(0 0, 100% 85%, 100% 100%, 0 100%); }

  /* Link-pills */
  .pill { display: inline-block; font-size: 6.8pt; font-weight: 600; padding: 1px 6px; border-radius: 4px; white-space: nowrap; line-height: 1.5; }
  .p-M { background: var(--db-nachtblauw); color: #fff; }
  .p-S { background: #DDEFFA; color: var(--db-diepblauw); }
  .p-F { background: var(--db-mist); color: var(--db-nachtblauw); }
  .p-H { background: #E3F5D3; color: var(--db-bosgroen); }
  .p-T { background: #FFF1C2; color: var(--db-nachtblauw); }
  .p-N { background: #fff; color: var(--db-grijs); border: 1px dashed var(--db-lichtgrijs); padding: 0 6px; }
  .warn { display: inline-flex; align-items: center; gap: 3px; font-size: 6.3pt; font-weight: 600; color: var(--db-kleur-fout); }
  .warn::before { content: "!"; width: 9px; height: 9px; border-radius: 50%; background: var(--db-kleur-fout); color: #fff; font-size: 6pt; display: grid; place-items: center; line-height: 1; }

  /* ---------- Omslag ---------- */
  .cover { background: var(--db-nachtblauw); color: #C9D1E8; padding: 16mm 16mm 12mm; display: grid; grid-template-columns: 1.1fr 1fr; gap: 14mm; }
  .cover .ruit { position: absolute; left: 28%; bottom: -120px; width: 420px; opacity: .28; }
  .cover .ruit polygon, .band-ruit polygon { fill: none; stroke-width: 34; }
  .cover-l { position: relative; display: flex; flex-direction: column; }
  .cover-l img { width: 110px; filter: brightness(0) invert(1); }
  .cover-l .eyebrow { color: var(--db-hemelsblauw); margin-top: 16mm; }
  .cover h1 { color: #fff; font-size: 34pt; line-height: 1.05; letter-spacing: -.02em; margin-top: 10px; }
  .cover h1 span { color: var(--db-signaalgroen); }
  .cover .lead { margin-top: 12px; font-size: 11.5pt; line-height: 1.55; font-weight: 300; color: #DDE3F2; max-width: 36ch; }
  .cover-stats { margin-top: auto; display: flex; gap: 22px; }
  .cover-stats b { display: block; color: var(--db-signaalgroen); font-size: 20pt; font-weight: 600; line-height: 1.1; }
  .cover-stats span { font-size: 8pt; color: #AEB8D6; }
  .cover-meta { margin-top: 10px; font-size: 7.5pt; color: #AEB8D6; }
  .toc { position: relative; align-self: start; background: #fff; border-radius: 12px; padding: 16px 20px; box-shadow: 0 30px 60px -30px rgba(0,0,0,.6); }
  .toc h2 { font-size: 12pt; margin-bottom: 6px; }
  .toc li { display: grid; grid-template-columns: 24px 1fr auto; align-items: baseline; gap: 6px; padding: 4px 0; border-bottom: 1px dotted #D5DBE5; font-size: 8.8pt; color: var(--db-nachtblauw); }
  .toc li:last-child { border-bottom: 0; }
  .toc .nr, .toc .pg { font-family: "IBM Plex Mono", monospace; font-size: 7.8pt; }
  .toc .nr { color: var(--db-webblauw); }
  .toc .pg { color: var(--db-grijs); }
  .toc .cnt { color: var(--db-grijs); font-size: 7.8pt; margin-left: 4px; }

  /* ---------- Overzicht ---------- */
  .ov-title { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 10px; }
  .ov-title h2 { font-size: 16pt; letter-spacing: -.01em; margin-top: 6px; }
  .ov-title p { max-width: 64ch; }
  .ov-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
  .ov-card { display: flex; flex-direction: column; gap: 4px; padding: 9px 11px; border-radius: 8px; border: 1px solid #D5DBE5; background: #fff; }
  .ov-card.main { background: var(--db-nachtblauw); border-color: var(--db-nachtblauw); color: #C9D1E8; }
  .ov-card.main h3 { color: #fff; }
  .ov-card .top { display: flex; align-items: center; justify-content: space-between; }
  .ov-card .top .i { color: var(--db-hemelsblauw); }
  .ov-card:not(.main) .top .i { color: var(--db-webblauw); }
  .ov-card h3 { font-size: 10pt; }
  .ov-card p { font-size: 7.8pt; line-height: 1.4; }
  .ov-card .meta { margin-top: auto; display: flex; justify-content: space-between; font-family: "IBM Plex Mono", monospace; font-size: 7.3pt; opacity: .85; }
  .badge { font-family: "IBM Plex Mono", monospace; font-size: 7.3pt; padding: 1px 6px; border-radius: 4px; background: rgba(255,255,255,.14); }
  .ov-card:not(.main) .badge { background: var(--db-mist); color: var(--db-nachtblauw); }
  .ov-bottom { margin-top: 10px; display: grid; grid-template-columns: 1.35fr 1fr; gap: 10px; }
  .box { border-radius: 10px; padding: 11px 13px; background: #F6F8FB; border: 1px solid #E3E8F0; }
  .box h3 { font-size: 9.5pt; margin-bottom: 7px; }
  .route { display: grid; grid-template-columns: 1fr 14px 1fr 14px 1fr 14px 1.1fr; align-items: center; gap: 4px; }
  .route + .route { margin-top: 6px; }
  .route .step { background: #fff; border: 1px solid #D5DBE5; border-radius: 7px; padding: 6px 8px; font-size: 7.8pt; line-height: 1.35; color: var(--db-nachtblauw); }
  .route .step b { display: block; font-size: 8.3pt; }
  .route .step small { color: var(--db-grijs); font-size: 7.1pt; }
  .route .step.end { background: var(--db-signaalgroen); border-color: var(--db-signaalgroen); }
  .route .step.end small { color: var(--db-nachtblauw); }
  .route .arr { color: var(--db-webblauw); text-align: center; }
  .legend-list li { display: grid; grid-template-columns: 70px 1fr; gap: 8px; align-items: center; padding: 2.5px 0; font-size: 7.8pt; }

  /* ---------- Onderdeel: kopband ---------- */
  .band { position: relative; overflow: hidden; display: grid; grid-template-columns: 62mm 1fr 78mm; gap: 7mm; align-items: start; padding: 10px 16px; border-radius: 10px; background: var(--db-nachtblauw); color: #C9D1E8; }
  .band-ruit { position: absolute; right: -40px; top: -70px; width: 200px; opacity: .22; }
  .b-head { display: flex; gap: 10px; align-items: flex-start; position: relative; }
  .b-nr { font-size: 28pt; line-height: .9; font-weight: 300; color: var(--db-signaalgroen); letter-spacing: -.03em; }
  .b-head h2 { color: #fff; font-size: 14pt; line-height: 1.15; }
  .b-head .path { font-family: "IBM Plex Mono", monospace; font-size: 7.5pt; color: #AEB8D6; }
  .b-head .kpis { margin-top: 6px; display: flex; gap: 10px; font-size: 7.3pt; }
  .b-head .kpis b { color: #fff; font-size: 10pt; margin-right: 3px; }
  .b-what { position: relative; }
  .b-what small, .b-facts small { display: block; font-size: 6.8pt; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--db-hemelsblauw); margin-bottom: 3px; }
  .b-what p { font-size: 8.6pt; line-height: 1.5; color: #DDE3F2; }
  .b-facts { position: relative; display: flex; flex-direction: column; gap: 4px; }
  .b-facts > div { display: grid; grid-template-columns: 27mm 1fr; gap: 6px; align-items: baseline; }
  .b-facts > div small { margin: 0; }
  .b-facts span { font-size: 8pt; line-height: 1.35; color: #fff; }
  .chips { display: flex; flex-wrap: wrap; gap: 3px; }
  .chip { font-size: 7.2pt; padding: 1px 7px; border-radius: 4px; background: rgba(255,255,255,.12); color: #fff; }

  /* ---------- Onderdeel: sitemap-boom ---------- */
  .org { flex: 1; display: flex; flex-direction: column; align-items: stretch; padding-top: 6px; min-height: 0; }
  .root-wrap { position: relative; display: flex; justify-content: center; padding-bottom: 14px; }
  .root-wrap::after { content: ""; position: absolute; left: 50%; bottom: 0; height: 14px; border-left: 2px solid var(--db-nachtblauw); }
  .root { display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 10px; border-radius: 9px; background: var(--db-signaalgroen); color: var(--db-nachtblauw); box-shadow: 0 8px 18px -10px rgba(109,178,63,.9); }
  .root .ic { width: 28px; height: 28px; border-radius: 7px; background: var(--db-nachtblauw); color: var(--db-signaalgroen); display: grid; place-items: center; }
  .root .ic .i { width: 16px; height: 16px; }
  .root b { display: block; font-size: 11pt; line-height: 1.15; }
  .root .u { font-family: "IBM Plex Mono", monospace; font-size: 7pt; }
  .root .pill { margin-left: 6px; }

  .row { display: grid; margin: 0 auto; width: 100%; }
  .col { position: relative; padding: 14px 4px 0; }
  .col::before { content: ""; position: absolute; top: 0; left: 0; right: 0; border-top: 2px solid var(--db-nachtblauw); }
  .col:first-child::before { left: 50%; }
  .col:last-child::before { right: 50%; }
  .col::after { content: ""; position: absolute; top: 0; left: 50%; height: 14px; border-left: 2px solid var(--db-nachtblauw); }

  .n1 { position: relative; display: flex; flex-direction: column; gap: 3px; padding: 8px 9px; border-radius: 8px; background: #fff; border: 1px solid #D5DBE5; border-top: 3px solid var(--db-diepblauw); box-shadow: 0 2px 6px -3px rgba(2,13,65,.18); }
  .n1.grp { background: var(--db-mist); border: 1px dashed #B9C3D3; border-top: 3px solid var(--db-webblauw); }
  .n1 .nm { font-size: 8.6pt; font-weight: 600; color: var(--db-nachtblauw); line-height: 1.25; }
  .n1 .u { font-family: "IBM Plex Mono", monospace; font-size: 6.5pt; color: var(--db-grijs); word-break: break-all; }
  .n1 .d { font-size: 7.3pt; line-height: 1.38; }
  .n1 .tags { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 3px; }

  .kids { position: relative; margin-top: 10px; padding: 5px; border-radius: 8px; background: #F1F4F9; display: grid; gap: 4px; }
  .kids::before { content: ""; position: absolute; top: -10px; left: 50%; height: 10px; border-left: 1.5px solid var(--lijn); }
  .kids.c2 { grid-template-columns: 1fr 1fr; }
  .kids.c3 { grid-template-columns: repeat(3, 1fr); }
  .n2 { display: flex; flex-direction: column; gap: 1px; padding: 4px 6px; border-radius: 6px; background: #fff; border: 1px solid #E3E8F0; }
  .n2 .nm { font-size: 7.7pt; font-weight: 500; color: var(--db-nachtblauw); line-height: 1.25; }
  .n2 .u { font-family: "IBM Plex Mono", monospace; font-size: 6.2pt; color: var(--db-grijs); word-break: break-all; }
  .n2 .d { font-size: 6.8pt; line-height: 1.32; }
  .n2 .tags { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 2px; }
  .n2 .pill { font-size: 6pt; padding: 0 5px; }
  .n2.chip { padding: 3px 7px; }
  .n2.chip .nm { font-size: 7.4pt; }

  .legend-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 7pt; color: var(--db-grijs); }
  .legend-row span { display: inline-flex; align-items: center; gap: 4px; }
  .note { font-size: 7.3pt; color: var(--db-nachtblauw); }

  /* ---------- Aandachtspunten ---------- */
  .issues { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .issue { border-radius: 10px; border: 1px solid #E3E8F0; padding: 10px 13px; display: flex; flex-direction: column; gap: 5px; }
  .issue .ih { display: flex; align-items: center; gap: 8px; }
  .issue .inr { width: 22px; height: 22px; border-radius: 6px; background: var(--db-nachtblauw); color: #fff; display: grid; place-items: center; font-size: 8.5pt; font-weight: 600; flex: none; }
  .issue h3 { font-size: 9.6pt; }
  .issue .prio { margin-left: auto; }
  .issue p { font-size: 8.1pt; }
  .issue .adv { padding-left: 10px; border-left: 2px solid var(--db-signaalgroen); color: var(--db-nachtblauw); }
  .issue code { font-family: "IBM Plex Mono", monospace; font-size: 7.2pt; color: var(--db-nachtblauw); }
</style>
</head>

<main id="doc"></main>

<script>
/* ---------- Iconen ---------- */
const IC = {
  truck: '<path d="M2.5 6.5h11v9.5h-11z"/><path d="M13.5 9.5h4l3 3.5v3h-7"/><circle cx="6.5" cy="17.5" r="1.9"/><circle cx="16.8" cy="17.5" r="1.9"/>',
  box: '<path d="M3.5 7.5 12 3.5l8.5 4v9L12 20.5l-8.5-4z"/><path d="M3.5 7.5 12 11.5l8.5-4M12 11.5v9"/>',

};
const icon = k => `<svg class="i" viewBox="0 0 24 24">${IC[k]}</svg>`;

const LINK = { M: 'Hoofdmenu', S: 'Snelmenu', F: 'Footer', H: 'Homepage', T: 'Taalkeuze', N: 'Geen link' };
const pill = c => c ? `<span class="pill p-${c}">${LINK[c]}</span>` : '';

   rows: [niveau, naam, url, omschrijving, link]
   niveau 0 = pagina van het onderdeel zelf, 1 = subpagina, 2 = onderliggend, 'g' = groep (geen eigen pagina) */

      [2, 'Engeland', '/internationale-verhuizing/engeland/', 'Naar het VK, ook na de Brexit geregeld.', 'N'],

      [2, 'Benelux-verhuizing', '/benelux-verhuizing/', 'Verhuizing of meubeltransport in de Benelux.', 'N'],
      [2, 'De Bresser Brussel', '/de-bresser-brussel/', 'Vestiging in Evere sinds 1 januari 2024.', 'N'],
      [2, 'Duitsland', '/duitsland/', '', 'N'],
      [2, 'Frankrijk', '/frankrijk/', '', 'N'],
      [2, 'Verhuisbedrijf België', '/verhuisbedrijf-belgie/', '', 'S'],
      [2, 'Verhuisbedrijf Europa', '/verhuisbedrijf-europa/', '', 'S'],
      [1, 'Zorgverhuizing', '/zorg-verhuizing/', 'Verhuizing van zorginstellingen, met aandacht voor bewoners.', 'M'],

    ] },
  { id: 'opslag', nr: '02', title: 'Opslag', path: '/opslag/', icon: 'box', main: true,
    one: 'Opslag voor particulieren en bedrijven, met lokale pagina’s per plaats.',
    wat: 'Veilige, flexibele opslag voor particulieren en bedrijven: tijdelijk tijdens een verhuizing of verbouwing, of structureel bij ruimtegebrek. Zes lokale pagina’s richten zich op opslag in een bepaalde plaats.',
    voor: ['Particulieren', 'Bedrijven'], actie: 'Offerte aanvragen', menu: 'Diensten → Opslag',
    rows: [
      [0, 'Opslag', '/opslag/', '', 'M'],
      [1, 'Zakelijke opslag', '/zakelijke-opslag/', 'Flexibele huur, geconditioneerde units, goed bereikbaar.', 'M'],
      [1, 'Particuliere opslag', '/particuliere-opslag/', 'Veilige units voor meubels en spullen. Inclusief DIY-opslag.', 'M'],

/* ---------- Boom opbouwen ---------- */
function tree(c) {
  const zeros = c.rows.filter(r => r[0] === 0);
  const single = zeros.length === 1;
  const root = single ? { name: zeros[0][1], url: zeros[0][2], link: zeros[0][4] } : { name: c.title, url: c.path, link: '' };
  const l1 = []; let cur = null;
  for (const r of c.rows) {
    if (single && r[0] === 0) continue;
    const isL1 = r[0] === 'g' || (single ? r[0] === 1 : r[0] === 0);
    const node = { lvl: r[0], name: r[1], url: r[2], d: r[3], link: r[4], kids: [] };
    if (isL1) { cur = node; l1.push(node); } else if (cur) cur.kids.push(node);
  }
  return { root, l1 };
}
const pagesCount = c => c.count || c.rows.filter(r => r[0] !== 'g' && !String(r[2]).includes('pdf')).length;
const linkCount = (c, code) => c.rows.filter(r => r[0] !== 'g' && r[4] === code).length;

const esc = s => s;
function nodeL2(k, chips) {
  if (chips) return `<div class="n2 chip"><span class="nm">${k.name}</span>${k.url ? `<span class="u">${k.url}</span>` : ''}</div>`;
  return `<div class="n2"><span class="nm">${k.name}</span>${k.url ? `<span class="u">${k.url}</span>` : ''}${k.d ? `<span class="d">${k.d}</span>` : ''}${(k.link || warn(k.url)) ? `<span class="tags">${pill(k.link)}${warn(k.url)}</span>` : ''}</div>`;
}
function orgHTML(c) {
  const t = tree(c);
  const wide = t.l1.length >= 6;          // veel kolommen: kolommen met subpagina's krijgen meer ruimte
  const cols = t.l1.map(n => {
    const many = n.kids.length > 5;
    const sub = many ? (wide ? 3 : 2) : 1;
    const cls = c.chips ? 'c3' : (sub === 3 ? 'c3' : sub === 2 ? 'c2' : '');
    const w = c.chips ? 2.2 : (many ? sub : (n.kids.length && wide ? 1.6 : 1));
    return { n, w, cls };
  });
  const unit = 205;
  const total = cols.reduce((s, x) => s + x.w, 0);
  const gtc = cols.map(x => `${x.w}fr`).join(' ');
  const colHTML = cols.map(({ n, cls }) => `<div class="col">
      <div class="n1${n.lvl === 'g' ? ' grp' : ''}">
        <span class="nm">${n.name}</span>
        ${n.url && n.lvl !== 'g' ? `<span class="u">${n.url}</span>` : ''}
        ${n.d ? `<span class="d">${n.d}</span>` : ''}
        ${(n.link || warn(n.url) || n.kids.length) ? `<span class="tags">${pill(n.link)}${warn(n.url)}${n.lvl === 'g' ? `<span class="pill p-F">${n.kids.length} pagina’s</span>` : ''}</span>` : ''}
      </div>
      ${n.kids.length ? `<div class="kids ${cls}">${n.kids.map(k => nodeL2(k, c.chips)).join('')}</div>` : ''}
    </div>`).join('');
  return `<div class="org">
    <div class="root-wrap"><div class="root">
      <span class="ic">${icon(c.icon)}</span>
      <div><b>${t.root.name}</b><span class="u">${t.root.url}</span></div>${pill(t.root.link)}
    </div></div>
    <div class="row" style="grid-template-columns:${gtc};max-width:${Math.round(total * unit)}px">${colHTML}</div>
  </div>`;
}

          <div class="kpis"><span><b>${total}</b>pagina’s</span>${inMenu ? `<span><b>${inMenu}</b>in hoofdmenu</span>` : ''}<span><b>${none}</b>geen link</span></div></div></div>
        <div class="b-what"><small>Wat is dit?</small><p>${c.wat}</p></div>
        <div class="b-facts">
          <div><small>Voor wie</small><span>${c.voor.join(' · ')}</span></div>
          <div><small>Belangrijkste actie</small><span>${c.actie}</span></div>
          <div><small>Te vinden in</small><span>${c.menu}</span></div>
        </div>
      </div>
      ${orgHTML(c)}
      ${foot(n)}`;
  }

  if (p.type === 'issues') {
    const noMetaCount = NO_META.length;
    const I = [
      ['Menu linkt via doorverwijzingen', 'Hoog', 'Vier menulinks gaan eerst naar een oude URL en worden dan doorgestuurd (301): <code>/opslag-zakelijk/</code>, <code>/opslag-particulier/</code>, <code>/montage-service/</code> en <code>/zakelijk-verhuizen/</code>.', 'Menulinks laten wijzen naar de echte URL. In de nieuwe homepage is dit al gedaan.'],
      [`${noMetaCount} pagina’s zonder eigen Google-omschrijving`, 'Hoog', 'Google toont dan zelf een stuk tekst, vaak het telefoonnummer en de eerste zin. Onder andere Kantoor verhuizen, Winkelverhuizing, Senioren verhuizen, FAQ en alle zes opslagruimte-pagina’s.', 'In Yoast per pagina een korte omschrijving invullen (± 150 tekens) met dienst en plaats.'],
      ['Tilburg heeft twee pagina’s', 'Middel', '<code>/tilburg/</code> en <code>/verhuisbedrijf-tilburg/</code> gaan over hetzelfde. Google weet dan niet welke het moet tonen.', 'Eén pagina houden (met de beste tekst) en de andere doorsturen.'],
      [`${notLinkedAll.length} dienstpagina’s en ${regioNot} regiopagina’s zonder link vanaf de homepage`, 'Middel', 'Bijvoorbeeld Senioren verhuizen, Full service verhuizing, de landenpagina’s, Videogesprek en FAQ. Bezoekers vinden ze moeilijk en Google weegt ze minder zwaar.', 'Opnemen in het menu, de footer of als link op de passende dienstpagina.'],
      ['Dubbele vermeldingen in de sitemap', 'Laag', 'Zes pagina’s staan twee keer in de Yoast-sitemap, zoals <code>/</code>, <code>/contact/</code> en <code>/over-ons/</code>.', 'Controleren in Yoast en de WPML-instellingen; elke pagina één keer vermelden.'],
      ['URL-structuur niet consequent', 'Laag', 'Engeland staat onder <code>/internationale-verhuizing/</code>, Duitsland en Frankrijk niet. Breda, Roosendaal en Bergen op Zoom missen het voorvoegsel <code>verhuisbedrijf-</code>.', 'Bij de nieuwe website één vaste opbouw kiezen en oude URL’s doorsturen.'],
    ];
    el.innerHTML = `${head('Aandachtspunten')}
      <div class="ov-title"><div><span class="eyebrow">Aandachtspunten en advies</span><h2>Wat kan er beter aan de structuur?</h2></div>
        <p>Gevonden bij het doorlopen van alle pagina’s, gesorteerd op belang voor bezoekers en vindbaarheid in Google.</p></div>
      <div class="issues">${I.map((x, k) => `<div class="issue"><div class="ih"><span class="inr">${k + 1}</span><h3>${x[0]}</h3><span class="pill ${x[1] === 'Hoog' ? 'p-M' : x[1] === 'Middel' ? 'p-S' : 'p-F'} prio">${x[1]}</span></div><p>${x[2]}</p><p class="adv"><b>Advies:</b> ${x[3]}</p></div>`).join('')}</div>
      <div class="pf"><span>De Bresser B.V. · Schijfstraat 13, 5061 KA Oisterwijk · 013 52 82 372 · debresser.nl</span><span>Stand 11 september 2026 · pagina ${n} van ${PLAN.length}</span></div>`;
  }
  doc.appendChild(el);
});
