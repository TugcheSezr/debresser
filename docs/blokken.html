<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Blokkenbibliotheek debresser.nl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../css/tokens.css">
<style>
  @page { size: A4 landscape; margin: 0; }
  * { box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { margin: 0; font-family: var(--db-font); color: var(--db-antraciet); font-size: 9pt; line-height: 1.45; background: #fff; }
  h1, h2, h3 { margin: 0; font-weight: 600; color: var(--db-nachtblauw); }
  p { margin: 0; }
  ul, ol { margin: 0; padding: 0; list-style: none; }
  .mono { font-family: "IBM Plex Mono", Consolas, monospace; }

  .page { width: 297mm; height: 210mm; padding: 10mm 12mm 8mm; display: flex; flex-direction: column; position: relative; overflow: hidden; break-after: page; }
  .page:last-child { break-after: auto; }
  .ph { display: flex; align-items: center; justify-content: space-between; padding-bottom: 7px; margin-bottom: 10px; border-bottom: 1px solid var(--db-mist); font-size: 8pt; color: var(--db-grijs); }
  .ph img { height: 22px; }
  .ph b { color: var(--db-nachtblauw); }
  .pf { margin-top: auto; padding-top: 7px; display: flex; justify-content: space-between; gap: 16px; font-size: 7.3pt; color: var(--db-grijs); border-top: 1px solid var(--db-mist); }

  .eyebrow { position: relative; display: inline-block; padding: 0 12px 6px 8px; color: var(--db-diepblauw); font-size: 7.5pt; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  .eyebrow::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 1.5px; background: currentColor; }
  .eyebrow::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: currentColor; clip-path: polygon(0 0, 100% 85%, 100% 100%, 0 100%); }
  .title-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 10px; }
  .title-row h2 { font-size: 15pt; margin-top: 5px; letter-spacing: -.01em; }
  .title-row p { max-width: 66ch; font-size: 8.6pt; }

  /* Achtergrond-pills */
  .bgp { display: inline-flex; align-items: center; gap: 4px; font-size: 6.8pt; font-weight: 600; color: var(--db-nachtblauw); white-space: nowrap; }
  .bgp i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; border: 1px solid #C7C7C7; }
  .c-N { background: var(--db-nachtblauw); border-color: var(--db-nachtblauw) !important; }
  .c-W { background: #fff; }
  .c-M { background: var(--db-mist); }
  .c-G { background: var(--db-signaalgroen); border-color: var(--db-signaalgroen) !important; }

  /* ---------- Omslag ---------- */
  .cover { background: var(--db-nachtblauw); color: #C7C7C7; padding: 16mm; display: grid; grid-template-columns: 1fr 1fr; gap: 14mm; }
  .cover .ruit { position: absolute; left: 32%; bottom: -130px; width: 420px; opacity: .26; }
  .cover .ruit polygon { fill: none; stroke-width: 34; }
  .cover-l { position: relative; display: flex; flex-direction: column; }
  .cover-l img { width: 110px; filter: brightness(0) invert(1); }
  .cover-l .eyebrow { color: var(--db-hemelsblauw); margin-top: 14mm; }
  .cover h1 { color: #fff; font-size: 32pt; line-height: 1.05; letter-spacing: -.02em; margin-top: 10px; }
  .cover h1 span { color: var(--db-signaalgroen); }
  .cover .lead { margin-top: 12px; font-size: 11pt; line-height: 1.55; font-weight: 300; color: #EBEFF4; max-width: 38ch; }
  .cover-meta { margin-top: auto; font-size: 7.5pt; color: #C7C7C7; }
  .cover-r { position: relative; display: flex; flex-direction: column; gap: 12px; }
  .flow { display: grid; grid-template-columns: 1fr 18px 1fr 18px 1fr; align-items: stretch; gap: 4px; }
  .flow .st { background: #fff; border-radius: 10px; padding: 12px; color: var(--db-antraciet); display: flex; flex-direction: column; gap: 4px; }
  .flow .st b { font-size: 24pt; line-height: 1; color: var(--db-nachtblauw); font-weight: 600; }
  .flow .st.g { background: var(--db-signaalgroen); }
  .flow .st span { font-size: 9pt; font-weight: 600; color: var(--db-nachtblauw); }
  .flow .st small { font-size: 7.6pt; line-height: 1.35; }
  .flow .ar { color: var(--db-signaalgroen); display: grid; place-items: center; font-size: 14px; }
  .why { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14); border-radius: 10px; padding: 12px 14px; }
  .why h3 { color: #fff; font-size: 10pt; margin-bottom: 6px; }
  .why li { position: relative; padding: 3px 0 3px 16px; font-size: 8.6pt; color: #EBEFF4; }
  .why li::before { content: ""; position: absolute; left: 0; top: 9px; width: 8px; height: 5px; border-left: 2px solid var(--db-signaalgroen); border-bottom: 2px solid var(--db-signaalgroen); transform: rotate(-45deg); }
  .toc { background: #fff; border-radius: 10px; padding: 10px 14px; }
  .toc li { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px dotted #C7C7C7; font-size: 8.4pt; color: var(--db-nachtblauw); }
  .toc li:last-child { border-bottom: 0; }
  .toc .pg { font-family: "IBM Plex Mono", monospace; font-size: 7.6pt; color: var(--db-grijs); }

  /* ---------- Blokkaarten ---------- */
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 1fr; gap: 9px; flex: 1; min-height: 0; }
  .card { display: flex; flex-direction: column; gap: 6px; padding: 9px 10px; border: 1px solid #EBEFF4; border-radius: 10px; background: #fff; min-height: 0; }
  .card-h { display: flex; align-items: center; gap: 7px; }
  .id { font-family: "IBM Plex Mono", monospace; font-size: 7.5pt; font-weight: 500; background: var(--db-nachtblauw); color: #fff; padding: 1px 6px; border-radius: 4px; }
  .card-h h3 { font-size: 9.8pt; line-height: 1.2; }
  .card-h .cat { font-size: 6.6pt; color: var(--db-grijs); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
  .card-h .bgp { margin-left: auto; }
  .doel { font-size: 7.8pt; line-height: 1.38; color: var(--db-nachtblauw); font-weight: 500; }
  .inh li { position: relative; padding-left: 9px; font-size: 7.1pt; line-height: 1.35; }
  .inh li::before { content: ""; position: absolute; left: 0; top: 5px; width: 4px; height: 4px; background: var(--db-webblauw); transform: skewX(-20deg); }
  .regel { font-size: 7pt; line-height: 1.35; padding-left: 7px; border-left: 2px solid var(--db-signaalgroen); color: var(--db-nachtblauw); }
  .use { margin-top: auto; display: flex; align-items: center; flex-wrap: wrap; gap: 3px; font-size: 6.6pt; color: var(--db-grijs); }
  .tp { font-family: "IBM Plex Mono", monospace; font-size: 6.6pt; padding: 0 5px; border-radius: 3px; border: 1px solid #C7C7C7; color: #C7C7C7; }
  .tp.on { background: var(--db-nachtblauw); border-color: var(--db-nachtblauw); color: #fff; }

  /* Mini-wireframes */
  .wf { position: relative; height: 70px; border-radius: 6px; border: 1px solid #C7C7C7; overflow: hidden; padding: 6px; display: flex; gap: 5px; flex: none; }
  .wf.N { background: var(--db-nachtblauw); border-color: var(--db-nachtblauw); }
  .wf.M { background: var(--db-mist); }
  .wf.W, .wf.G { background: #fff; }
  .wf .col { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
  .wf .row { display: flex; gap: 3px; align-items: center; }
  .wf .l { display: block; height: 3px; border-radius: 2px; background: #C7C7C7; }
  .wf .l.t { height: 6px; background: #676767; }
  .wf .l.bl { background: var(--db-webblauw); }
  .wf.N .l { background: rgba(255,255,255,.4); }
  .wf.N .l.t { background: #fff; }
  .wf.N .l.bl { background: var(--db-hemelsblauw); }
  .wf .p { display: block; border-radius: 4px; background: linear-gradient(150deg, #007AC0, #007AC0); }
  .wf .k { display: block; width: 22px; height: 7px; border-radius: 2px; background: var(--db-signaalgroen); }
  .wf .o { display: block; width: 22px; height: 7px; border-radius: 2px; border: 1px solid #676767; }
  .wf.N .o { border-color: rgba(255,255,255,.6); }
  .wf .nb { display: block; width: 22px; height: 7px; border-radius: 2px; background: var(--db-nachtblauw); }
  .wf .b { display: block; border-radius: 4px; background: #fff; border: 1px solid #EBEFF4; box-shadow: 0 1px 2px rgba(2,13,65,.08); padding: 3px; }
  .wf .ic { display: block; width: 8px; height: 8px; border-radius: 2px; background: var(--db-mist); border: 1px solid #C7C7C7; }
  .wf .y { display: block; width: 14px; height: 4px; border-radius: 2px; background: var(--db-kroongeel); }
  .wf .gr { display: block; height: 4px; width: 60%; border-radius: 2px; background: #C7C7C7; }
  .wf .step { display: block; width: 14px; height: 9px; background: var(--db-nachtblauw); clip-path: polygon(22% 0, 100% 0, 78% 100%, 0 100%); }
  .wf .step.g { background: var(--db-signaalgroen); }
  .wf .gp { position: absolute; inset: 7px; border-radius: 6px; background: var(--db-signaalgroen); padding: 7px; display: flex; gap: 6px; }
  .wf .ruit { position: absolute; right: -12px; top: -14px; width: 60px; opacity: .5; }
  .wf .ruit polygon { fill: none; stroke-width: 36; }

  /* ---------- Templates ---------- */
  .tpl-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; flex: 1; min-height: 0; }
  .tpl { display: flex; flex-direction: column; gap: 6px; min-height: 0; }
  .tpl-h { display: flex; align-items: baseline; gap: 7px; }
  .tpl-h .id { font-size: 8pt; }
  .tpl-h h3 { font-size: 11pt; }
  .tpl-meta { font-size: 7.4pt; line-height: 1.35; color: var(--db-antraciet); min-height: 30px; }
  .tpl-meta b { color: var(--db-nachtblauw); }
  .stack { display: flex; flex-direction: column; border-radius: 8px; overflow: hidden; border: 1px solid #C7C7C7; }
  .strip { display: flex; align-items: center; gap: 6px; padding: 0 8px; font-size: 7.3pt; color: var(--db-nachtblauw); border-top: 1px solid rgba(2,13,65,.07); }
  .strip:first-child { border-top: 0; }
  .strip .sid { font-family: "IBM Plex Mono", monospace; font-size: 6.6pt; opacity: .75; width: 22px; flex: none; }
  .strip .opt { margin-left: auto; font-size: 6.3pt; opacity: .7; font-style: normal; }
  .strip.N { background: var(--db-nachtblauw); color: #fff; }
  .strip.M { background: var(--db-mist); }
  .strip.W { background: #fff; }
  .strip.G { background: #fff; padding: 3px 5px; }
  .strip.G span.inner { flex: 1; display: flex; align-items: center; gap: 6px; height: 100%; padding: 0 6px; border-radius: 5px; background: var(--db-signaalgroen); }
  .tpl-foot { font-size: 7pt; color: var(--db-grijs); }

  /* ---------- Regels ---------- */
  .rules-grid { display: grid; grid-template-columns: 1.15fr 1fr; gap: 12px; flex: 1; min-height: 0; }
  .panel { border: 1px solid #EBEFF4; border-radius: 10px; padding: 12px 14px; }
  .panel h3 { font-size: 10.5pt; margin-bottom: 7px; }
  .rules li { display: grid; grid-template-columns: 20px 1fr; gap: 8px; padding: 5px 0; border-bottom: 1px dotted #EBEFF4; font-size: 8.2pt; line-height: 1.4; }
  .rules li:last-child { border-bottom: 0; }
  .rules .n { width: 20px; height: 20px; border-radius: 6px; background: var(--db-nachtblauw); color: #fff; display: grid; place-items: center; font-size: 8pt; font-weight: 600; }
  .rules b { color: var(--db-nachtblauw); }
  .steps li { display: grid; grid-template-columns: 34px 1fr; gap: 8px; padding: 5px 0; font-size: 8.1pt; line-height: 1.4; }
  .steps .sn { width: 30px; height: 20px; display: grid; place-items: center; background: var(--db-nachtblauw); color: #fff; font-weight: 600; font-size: 8pt; clip-path: polygon(22% 0, 100% 0, 78% 100%, 0 100%); }
  .steps li:last-child .sn { background: var(--db-signaalgroen); color: var(--db-nachtblauw); }
  .steps b { color: var(--db-nachtblauw); }
  .el li { position: relative; padding: 3px 0 3px 14px; font-size: 8pt; line-height: 1.4; }
  .el li::before { content: ""; position: absolute; left: 0; top: 8px; width: 6px; height: 6px; background: var(--db-signaalgroen); transform: skewX(-20deg); }
  .el code { font-family: "IBM Plex Mono", monospace; font-size: 7.3pt; color: var(--db-nachtblauw); background: var(--db-mist); padding: 0 4px; border-radius: 3px; }
</style>
</head>
<body>
<main id="doc"></main>
<script>
const LOGO = '../assets/img/logo-de-bresser.png';
const LOGOC = '../assets/img/logo-de-bresser-compact.png';
const RUIT = (cls, sw) => `<svg class="${cls}" viewBox="0 0 460 450"><polygon points="190,114 340,34 340,234 190,316" stroke="#00498F" stroke-width="${sw || 34}"/><polygon points="58,294 208,214 346,297 186,378" stroke="#007DC2" stroke-width="${sw || 34}"/><polygon points="268,134 422,220 422,402 268,318" stroke="#6DB23F" stroke-width="${sw || 34}"/></svg>`;
const BGNAME = { N: 'Nachtblauw', W: 'Wit', M: 'Mist', G: 'Signaalgroen' };
const bgPill = bg => `<span class="bgp">${bg.split('/').map(b => `<i class="c-${b}"></i>`).join('')}${bg.split('/').map(b => BGNAME[b]).join(' / ')}</span>`;

/* ---------- Mini-wireframes ---------- */
const L = (w, cls = '') => `<i class="l ${cls}" style="width:${w}%"></i>`;
const WF = {
  util: `<div class="col" style="justify-content:center"><div class="row">${L(18)}${L(16)}${L(22)}<span style="flex:1"></span>${L(14)}${L(18)}</div></div>`,
  header: `<div class="row" style="width:100%"><i class="ic" style="width:14px;height:14px"></i><span style="flex:1"></span>${L(8)}${L(8)}${L(8)}${L(8)}${L(8)}<i class="k" style="width:28px"></i></div>`,
  footer: `<div class="col" style="flex:.7"><i class="ic" style="width:14px;height:14px;background:#fff"></i>${L(80)}${L(60)}${L(70)}</div>${[1,2,3,4].map(() => `<div class="col">${L(60,'t')}${L(80)}${L(70)}${L(75)}${L(60)}</div>`).join('')}`,
  mobile: `<div class="col" style="align-items:center;justify-content:flex-end"><div style="width:52px;height:100%;border:1px solid #C7C7C7;border-radius:6px;display:flex;flex-direction:column;justify-content:flex-end;padding:3px;gap:2px"><div class="row"><i class="o" style="width:14px"></i><i class="k" style="width:26px"></i></div></div></div>`,
  herohome: `<div class="col" style="justify-content:center"><i class="y"></i>${L(70,'t')}${L(55,'t')}${L(80)}<div class="row" style="margin-top:2px"><i class="k"></i><i class="o"></i></div></div><i class="p" style="flex:1"></i>`,
  heropage: `<div class="col" style="justify-content:center">${L(30)}${L(25,'bl')}${L(75,'t')}${L(85)}${L(60)}<div class="row" style="margin-top:2px"><i class="k"></i><i class="o"></i></div></div><i class="p" style="flex:.8"></i>`,
  logos: `<div class="row" style="width:100%;justify-content:space-around">${'<i class="gr" style="width:14%"></i>'.repeat(5)}</div>`,
  usps: [1,2,3,4].map(() => `<div class="col" style="justify-content:center"><i class="ic"></i>${L(70,'t')}${L(90)}${L(60)}</div>`).join(''),
  stats: [1,2,3,4].map(() => `<div class="col" style="justify-content:center"><i class="l" style="width:70%;height:9px;background:var(--db-signaalgroen)"></i>${L(90)}${L(60)}</div>`).join(''),
  reviews: [1,2,3].map(() => `<i class="b col"><span class="row"><i class="y"></i></span>${L(90)}${L(85)}${L(70)}<span style="flex:1"></span>${L(40,'t')}</i>`).join(''),
  cards6: `<div class="col">${[0,1].map(() => `<div class="row" style="flex:1">${[1,2,3].map(() => `<i class="b col" style="flex:1;height:100%"><i class="ic"></i>${L(60,'t')}${L(85)}</i>`).join('')}</div>`).join('')}</div>`,
  cards3: [1,2,3].map(() => `<i class="b col"><i class="ic"></i>${L(60,'t')}${L(90)}${L(80)}<span style="flex:1"></span>${L(35,'bl')}</i>`).join(''),
  cards3w: [1,2,3].map(() => `<i class="b col" style="box-shadow:none"><i class="ic"></i>${L(60,'t')}${L(90)}<span style="flex:1"></span>${L(35,'bl')}</i>`).join(''),
  textimg: `<div class="col" style="justify-content:center">${L(25,'bl')}${L(70,'t')}${L(95)}${L(90)}${L(92)}${L(70)}</div><i class="p" style="flex:.85"></i>`,
  steps: [0,1,2,3].map(i => `<div class="col" style="justify-content:center"><i class="step ${i === 3 ? 'g' : ''}"></i>${L(60,'t')}${L(90)}${L(70)}</div>`).join(''),
  green: `${RUIT('ruit', 40)}<div class="col" style="justify-content:center">${L(30,'bl')}${L(70,'t')}${L(90)}${L(85)}<i class="o"></i></div><div class="col" style="justify-content:center"><i class="b" style="background:#020D41;border-color:rgba(255,255,255,.15);box-shadow:none;height:80%;display:flex;flex-direction:column;gap:3px"><i class="l" style="width:60%;height:8px;background:var(--db-signaalgroen)"></i>${L(80)}${L(70)}</i></div>`,
  about: `<div style="flex:.9;position:relative"><i class="p" style="height:100%"></i><i class="b" style="position:absolute;left:4px;bottom:4px;width:40%;height:14px"></i></div><div class="col" style="justify-content:center">${L(25,'bl')}${L(80,'t')}${L(95)}${L(90)}<div class="row">${L(20,'t')}${L(20,'t')}${L(20,'t')}</div><i class="nb"></i></div>`,
  blog: [1,2,3].map(() => `<i class="b col" style="padding:0;overflow:hidden"><i class="p" style="height:26px;border-radius:0"></i><span class="col" style="padding:3px">${L(40)}${L(80,'t')}${L(90)}</span></i>`).join(''),
  faq: `<div class="col" style="justify-content:center">${[1,2,3,4].map(() => `<div class="row" style="border-bottom:1px solid #EBEFF4;padding:2px 0">${L(70,'t')}<span style="flex:1"></span><i class="l" style="width:6px;height:6px;border-radius:50%;background:var(--db-webblauw)"></i></div>`).join('')}</div>`,
  area: `<div class="col" style="flex:.8;justify-content:center">${L(30,'bl')}${L(80,'t')}${[1,2,3,4].map(() => `<div class="row"><i class="l" style="width:5px;height:5px;border-radius:50%;background:var(--db-signaalgroen)"></i>${L(50)}</div>`).join('')}</div><div class="col" style="flex:1.2;display:grid;grid-template-columns:repeat(4,1fr);gap:3px;align-content:center">${'<i class="l" style="width:100%;height:7px;border-radius:2px;background:var(--db-mist);border:1px solid #C7C7C7"></i>'.repeat(16)}</div>`,
  form: `<div class="col" style="flex:.7;justify-content:center">${L(30,'bl')}${L(80,'t')}${L(90)}${L(70)}</div><i class="b" style="flex:1;display:grid;grid-template-columns:1fr 1fr;gap:3px;align-content:center">${'<i class="l" style="width:100%;height:8px;border-radius:2px;background:#fff;border:1px solid #C7C7C7"></i>'.repeat(4)}<i class="k" style="grid-column:1/-1"></i></i>`,
  cta: `<div class="gp">${RUIT('ruit', 40).replace('opacity', 'o')}<div class="col" style="justify-content:center">${'<i class="l" style="width:75%;height:6px;background:var(--db-nachtblauw)"></i>'}${'<i class="l" style="width:55%;height:6px;background:var(--db-nachtblauw)"></i>'}<i class="l" style="width:80%;background:rgba(2,13,65,.45)"></i></div><div class="col" style="flex:.6;justify-content:center;align-items:flex-end"><i class="nb"></i><i class="o" style="border-color:var(--db-nachtblauw)"></i></div></div>`,
};

/* ---------- Blokken ---------- */
const B = [
  { id: 'B01', cat: 'Globaal', name: 'Utility-balk', bg: 'N', wf: 'util', t: [1,2,3,4],
    doel: 'Vertrouwen en contact direct zichtbaar, op elke pagina.',
    inh: ['3 vinkjes: Erkende Verhuizer · Sinds 1923 · Eén vast aanspreekpunt', 'Telefoon en e-mail', 'Taalkeuze NL / EN'],
    regel: 'Tekst 13 px, vinkjes Signaalgroen. Verborgen op mobiel.' },
  { id: 'B02', cat: 'Globaal', name: 'Header', bg: 'W', wf: 'header', t: [1,2,3,4],
    doel: 'Navigatie naar alle diensten en altijd een offerteknop.',
    inh: ['Logo zonder payoff (min. 80 px breed)', 'Mega menu Diensten, Over ons, Vacatures, Blog, Contact', 'Telefoon + knop Offerte aanvragen'],
    regel: 'Blijft vast bovenaan. Mobiel: menuknop. Eén groene knop.' },
  { id: 'B03', cat: 'Globaal', name: 'Footer', bg: 'N', wf: 'footer', t: [1,2,3,4],
    doel: 'Alle links, contact en juridische informatie onderaan.',

function card(b) {
  return `<article class="card">
    <div class="card-h"><span class="id">${b.id}</span><div><h3>${b.name}</h3><span class="cat">${b.cat}</span></div>${bgPill(b.bg)}</div>

  </article>`;
}
