<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Wireframes debresser.nl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../css/tokens.css">
<style>
  @page { size: A4 landscape; margin: 0; }
  * { box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { margin: 0; font-family: var(--db-font); color: var(--db-antraciet); font-size: 9pt; line-height: 1.45; background: #fff; }
  h1, h2, h3 { margin: 0; font-weight: 600; color: var(--db-nachtblauw); }
  p { margin: 0; }
  ul { margin: 0; padding: 0; list-style: none; }
  .mono { font-family: "IBM Plex Mono", Consolas, monospace; }
  svg.i { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---------- Vel ---------- */
  .sheet { width: 297mm; height: 210mm; padding: 8mm 11mm 6mm; display: flex; flex-direction: column; overflow: hidden; break-after: page; position: relative; }
  .sheet:last-child { break-after: auto; }
  .sh-top { display: flex; align-items: center; gap: 12px; padding-bottom: 7px; margin-bottom: 9px; border-bottom: 1px solid var(--db-mist); }
  .sh-top img { height: 22px; }
  .sh-top .doc { font-size: 7.6pt; color: var(--db-grijs); }
  .sh-top .doc b { color: var(--db-nachtblauw); }
  .tab { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .tab .pn { font-family: "IBM Plex Mono", monospace; font-size: 7.5pt; background: var(--db-nachtblauw); color: #fff; padding: 2px 7px; border-radius: 4px; }
  .tab .nm { font-size: 9.5pt; font-weight: 600; color: var(--db-nachtblauw); }
  .tab .url { font-family: "IBM Plex Mono", monospace; font-size: 7.3pt; color: var(--db-grijs); }
  .tab .tpl { font-size: 6.8pt; font-weight: 600; padding: 1px 6px; border-radius: 4px; background: #DDEFFA; color: var(--db-diepblauw); }
  .sh-foot { margin-top: auto; padding-top: 6px; border-top: 1px solid var(--db-mist); display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 6.8pt; color: var(--db-grijs); }
  .sh-foot .lg { display: flex; align-items: center; gap: 8px; }

  .page-intro { display: grid; grid-template-columns: auto 1fr 1fr; gap: 16px; align-items: center; padding: 8px 12px; margin-bottom: 9px; border-radius: 9px; background: var(--db-nachtblauw); color: #C9D1E8; }
  .page-intro .big { font-size: 24pt; font-weight: 300; line-height: 1; color: var(--db-signaalgroen); }
  .page-intro h2 { color: #fff; font-size: 13pt; }
  .page-intro .u { font-family: "IBM Plex Mono", monospace; font-size: 7pt; color: #AEB8D6; }
  .page-intro small { display: block; font-size: 6.4pt; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--db-hemelsblauw); }
  .page-intro span.v { font-size: 7.8pt; color: #fff; line-height: 1.4; }

  .sh-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 112px 1fr; gap: 14px; }
  .mini { border-right: 1px solid var(--db-mist); padding-right: 10px; }
  .mini h4 { margin: 0 0 6px; font-size: 6.4pt; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--db-grijs); }
  .mini li { display: grid; grid-template-columns: 9px 14px 1fr; gap: 4px; align-items: center; padding: 2px 3px; font-size: 6.6pt; line-height: 1.25; color: #9AA3B5; border-radius: 3px; }
  .mini li i { width: 9px; height: 9px; border-radius: 2px; border: 1px solid #C9D1DD; }
  .mini li .n { font-family: "IBM Plex Mono", monospace; font-size: 6pt; }
  .mini li.on { color: var(--db-nachtblauw); font-weight: 600; background: #F1F4F9; }
  .mini li.g { font-style: italic; }
  .c-N { background: var(--db-nachtblauw); border-color: var(--db-nachtblauw) !important; }
  .c-W { background: #fff; }
  .c-M { background: var(--db-mist); }
  .c-G { background: var(--db-signaalgroen); border-color: var(--db-signaalgroen) !important; }

  .rows { display: flex; flex-direction: column; gap: 9px; min-height: 0; }
  .row { display: grid; grid-template-columns: 520px 1fr; gap: 14px; align-items: start; }
  .rl { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .rl .no { width: 17px; height: 17px; border-radius: 5px; background: var(--db-nachtblauw); color: #fff; font-size: 7pt; font-weight: 600; display: grid; place-items: center; }
  .rl .code { font-family: "IBM Plex Mono", monospace; font-size: 6.8pt; color: var(--db-webblauw); font-weight: 500; }
  .rl .bn { font-size: 8.4pt; font-weight: 600; color: var(--db-nachtblauw); }
  .rl .bgp { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-size: 6.4pt; color: var(--db-grijs); }
  .rl .bgp i { width: 9px; height: 9px; border-radius: 2px; border: 1px solid #C9D1DD; display: inline-block; }
  .frame { border-radius: 8px; overflow: hidden; border: 1px solid #D5DBE5; box-shadow: 0 6px 16px -10px rgba(2,13,65,.35); }

  .spec { padding-top: 21px; }
  .spec li { display: grid; grid-template-columns: 66px 1fr; gap: 8px; padding: 2.5px 0; border-bottom: 1px dotted #E3E8F0; font-size: 7.3pt; line-height: 1.42; }
  .spec li:last-child { border-bottom: 0; }
  .spec .k { font-size: 6.2pt; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--db-grijs); padding-top: 1px; }
  .spec .v { color: var(--db-antraciet); }
  .spec q { quotes: "“" "”"; color: var(--db-nachtblauw); font-weight: 500; }
  .sb { display: inline-block; font-size: 6.4pt; font-weight: 600; padding: 0 6px; border-radius: 3px; line-height: 1.7; white-space: nowrap; vertical-align: 1px; }
  .sb.g { background: var(--db-signaalgroen); color: var(--db-nachtblauw); }
  .sb.n { background: var(--db-nachtblauw); color: #fff; }
  .sb.o { border: 1px solid var(--db-nachtblauw); color: var(--db-nachtblauw); line-height: 1.5; }
  .sb.l { color: var(--db-webblauw); padding: 0; }
  .sb.t { background: var(--db-kroongeel); color: var(--db-nachtblauw); }
  .vt, .ct, .at { display: inline-block; font-size: 5.8pt; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 0 4px; border-radius: 3px; vertical-align: 1px; margin-left: 3px; }
  .vt { background: #EDE7FF; color: #4B3A99; }
  .ct { background: #FFE3E0; color: var(--db-kleur-fout); }
  .at { background: #FFF1C2; color: #7A5B00; }

  /* ---------- Mockups ---------- */
  .m { position: relative; overflow: hidden; padding: 12px 16px; font-family: var(--db-font); color: #2F2F2F; font-size: 7px; line-height: 1.5; }
  .m.N { background: var(--db-nachtblauw); color: #C9D1E8; }
  .m.M { background: var(--db-mist); }
  .m.W { background: #fff; }
  .m.G { background: #fff; padding: 9px; }
  .m-eb { position: relative; display: inline-block; padding: 0 8px 4px 5px; font-size: 5.6px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--db-diepblauw); }
  .m-eb::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 1px; background: currentColor; }
  .m-eb::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: currentColor; clip-path: polygon(0 0, 100% 85%, 100% 100%, 0 100%); }
  .N .m-eb { color: var(--db-hemelsblauw); }
  .m-h1 { font-size: 19px; line-height: 1.12; font-weight: 600; letter-spacing: -.02em; color: #fff; }
  .m-h1 .g { color: var(--db-signaalgroen); }
  .m-h2 { font-size: 12.5px; line-height: 1.2; font-weight: 600; letter-spacing: -.01em; color: var(--db-nachtblauw); }
  .N .m-h2 { color: #fff; }
  .m-h3 { font-size: 8px; font-weight: 600; color: var(--db-nachtblauw); line-height: 1.25; }
  .m-p { font-size: 7px; line-height: 1.55; }
  .N .m-p { color: #DDE3F2; }
  .m-b { display: inline-flex; align-items: center; gap: 3px; font-size: 6.4px; font-weight: 600; padding: 4px 8px; border-radius: 3px; white-space: nowrap; border: 1px solid transparent; }
  .m-b.g { background: var(--db-signaalgroen); color: var(--db-nachtblauw); box-shadow: 0 3px 8px -4px rgba(123,213,52,.8); }
  .m-b.n { background: var(--db-nachtblauw); color: #fff; }
  .m-b.o { border-color: var(--db-nachtblauw); color: var(--db-nachtblauw); }
  .m-b.ow { border-color: rgba(255,255,255,.6); color: #fff; }
  .m-b.l { padding: 0; color: var(--db-webblauw); }
  .m-b.lw { padding: 0; color: var(--db-signaalgroen); }
  .m-btns { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
  .m-img { background-size: cover; background-position: center; border-radius: 8px; }
  .m-card { background: #fff; border: 1px solid #E3E8F0; border-radius: 6px; padding: 7px 8px; box-shadow: 0 2px 6px -3px rgba(2,13,65,.18); display: flex; flex-direction: column; gap: 3px; position: relative; }
  .m-ic { width: 17px; height: 17px; border-radius: 4px; background: var(--db-mist); color: var(--db-nachtblauw); display: grid; place-items: center; }
  .m-tag { display: inline-block; font-size: 5.2px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 1px 4px; border-radius: 2px; background: var(--db-kroongeel); color: var(--db-nachtblauw); font-style: normal; }
  .m-chip { display: inline-block; font-size: 5.8px; padding: 1px 5px; border-radius: 3px; background: #fff; border: 1px solid #D5DBE5; color: var(--db-nachtblauw); margin: 0 2px 2px 0; }
  .m-g { display: grid; gap: 6px; }
  .m-row { display: flex; gap: 12px; }
  .m-col { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .m-head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 8px; gap: 10px; }
  .m-head .m-col { gap: 3px; }
  .cl2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .cl3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .m-more { margin-top: auto; font-size: 6px; font-weight: 600; color: var(--db-webblauw); }
  .m-usps { display: flex; gap: 9px; font-size: 6px; color: #DDE3F2; padding-top: 6px; border-top: 1px solid rgba(255,255,255,.12); }
  .m-usps span::before { content: "✓ "; color: var(--db-signaalgroen); font-weight: 700; }
  .m-announce { display: inline-flex; gap: 5px; align-items: center; font-size: 6px; color: #fff; padding: 2px 6px 2px 2px; border: 1px solid rgba(255,255,255,.18); border-radius: 3px; width: max-content; }
  .m-announce b { color: var(--db-signaalgroen); }
  .m-crumb { font-size: 5.8px; color: #AEB8D6; }
  .m-stars { color: var(--db-kroongeel); letter-spacing: 1px; font-size: 7px; }
  .m-step { width: 20px; height: 13px; background: var(--db-nachtblauw); color: #fff; display: grid; place-items: center; font-size: 6.5px; font-weight: 600; clip-path: polygon(22% 0, 100% 0, 78% 100%, 0 100%); }
  .m-step.g { background: var(--db-signaalgroen); color: var(--db-nachtblauw); }
  .m-field { display: flex; flex-direction: column; gap: 1px; font-size: 5.6px; font-weight: 600; color: var(--db-nachtblauw); }
  .m-field i { display: block; height: 12px; border: 1px solid #C7C7C7; border-radius: 3px; background: #fff; font-style: normal; font-weight: 400; font-size: 5.6px; color: #9AA3B5; padding: 1px 4px; }
  .m-field.ta i { height: 26px; }
  .m-opt { display: inline-flex; align-items: center; gap: 3px; font-size: 5.8px; margin: 0 6px 3px 0; color: var(--db-nachtblauw); }
  .m-opt::before { content: ""; width: 6px; height: 6px; border: 1px solid #8E9AB0; border-radius: 50%; }
  .m-opt.sq::before { border-radius: 1px; }
  .m-ruit { position: absolute; pointer-events: none; }
  .m-ruit polygon { fill: none; stroke-width: 36; }
  .m-stat b { display: block; font-size: 15px; line-height: 1; font-weight: 600; color: var(--db-signaalgroen); }
  .W .m-stat b, .M .m-stat b { color: var(--db-nachtblauw); }
  .m-stat span { font-size: 5.8px; }
  .m-faq { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; border-bottom: 1px solid #E3E8F0; font-size: 6.6px; font-weight: 600; color: var(--db-nachtblauw); }
  .m-faq em { font-style: normal; color: var(--db-webblauw); }
  .m-logo { height: 13px; filter: brightness(0); opacity: .45; }

  /* ---------- Omslag en intro ---------- */
  .cover { background: var(--db-nachtblauw); color: #C9D1E8; padding: 15mm 16mm 12mm; display: grid; grid-template-columns: 1.05fr 1fr; gap: 14mm; }
  .cover .ruit { position: absolute; left: 30%; bottom: -130px; width: 430px; opacity: .26; }
  .cover .ruit polygon { fill: none; stroke-width: 34; }
  .cv-l { position: relative; display: flex; flex-direction: column; }
  .cv-l img { width: 108px; filter: brightness(0) invert(1); }
  .cv-l .eb { margin-top: 13mm; font-size: 7.5pt; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--db-hemelsblauw); }
  .cover h1 { color: #fff; font-size: 33pt; line-height: 1.04; letter-spacing: -.02em; margin-top: 8px; }
  .cover h1 span { color: var(--db-signaalgroen); }
  .cover .lead { margin-top: 12px; font-size: 11pt; line-height: 1.55; font-weight: 300; color: #DDE3F2; max-width: 40ch; }
  .cv-stats { margin-top: auto; display: flex; gap: 22px; }
  .cv-stats b { display: block; color: var(--db-signaalgroen); font-size: 20pt; font-weight: 600; line-height: 1.1; }
  .cv-stats span { font-size: 7.8pt; color: #AEB8D6; }
  .cv-meta { margin-top: 10px; font-size: 7.3pt; color: #AEB8D6; }
  .toc { position: relative; align-self: start; background: #fff; border-radius: 12px; padding: 14px 18px; box-shadow: 0 30px 60px -30px rgba(0,0,0,.6); }
  .toc h2 { font-size: 11.5pt; margin-bottom: 4px; }
  .toc li { display: grid; grid-template-columns: 30px 1fr auto auto; align-items: baseline; gap: 8px; padding: 4px 0; border-bottom: 1px dotted #D5DBE5; font-size: 8.6pt; color: var(--db-nachtblauw); }
  .toc li:last-child { border-bottom: 0; }
  .toc .nr, .toc .pg { font-family: "IBM Plex Mono", monospace; font-size: 7.4pt; }
  .toc .nr { color: var(--db-webblauw); }
  .toc .pg { color: var(--db-grijs); }
  .toc .t { font-size: 6.6pt; padding: 0 5px; border-radius: 3px; background: #DDEFFA; color: var(--db-diepblauw); font-weight: 600; }

  .intro-grid { flex: 1; display: grid; grid-template-columns: 1.25fr 1fr; gap: 14px; min-height: 0; }
  .box { border: 1px solid #DDE3EC; border-radius: 10px; padding: 12px 14px; }
  .box h3 { font-size: 10.5pt; margin-bottom: 8px; }
  .how { display: grid; grid-template-columns: 112px 1fr 1fr; gap: 10px; }
  .how div { border-radius: 8px; padding: 9px; font-size: 7.6pt; line-height: 1.45; }
  .how b { display: block; color: var(--db-nachtblauw); font-size: 8.4pt; margin-bottom: 3px; }
  .legend li { display: grid; grid-template-columns: 118px 1fr; gap: 8px; align-items: center; padding: 3.5px 0; border-bottom: 1px dotted #E3E8F0; font-size: 7.6pt; }
  .legend li:last-child { border-bottom: 0; }
  .legend .sw { display: inline-flex; gap: 4px; align-items: center; }
  .legend .sw i { width: 12px; height: 12px; border-radius: 3px; border: 1px solid #C9D1DD; display: inline-block; }
</style>
</head>
<body>
<main id="doc"></main>
<script>
/* ================= Hulpfuncties ================= */
const IMG = '../assets/img/';
const IC = {
  truck: '<path d="M2.5 6.5h11v9.5h-11z"/><path d="M13.5 9.5h4l3 3.5v3h-7"/><circle cx="6.5" cy="17.5" r="1.9"/><circle cx="16.8" cy="17.5" r="1.9"/>',
  box: '<path d="M3.5 7.5 12 3.5l8.5 4v9L12 20.5l-8.5-4z"/><path d="M3.5 7.5 12 11.5l8.5-4M12 11.5v9"/>',
  sofa: '<path d="M5 10.5V8a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v2.5"/><path d="M3 11h3v3.5h12V11h3v5.5H3z"/><path d="M5 16.5v2M19 16.5v2"/>',
  building: '<path d="M4.5 20.5v-16h9.5v16M14 9.5h5.5v11M2.5 20.5h19"/><path d="M7.5 8h3M7.5 12h3M7.5 16h3M16.5 13h.5M16.5 16.5h.5"/>',
  passport: '<path d="M8.5 3.5h7v3h-7z"/><path d="M8.5 5H5.5v15.5h13V5h-3"/><path d="m8.8 13.2 2.4 2.4 4.3-4.6"/>',
  leaf: '<path d="M5 19c0-8 5-13.5 14.5-14.5C18.5 14 13 19 5 19z"/><path d="M5 19 13 11"/>',
  people: '<circle cx="9" cy="8" r="3.2"/><path d="M3 19.5c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M16 5.2a3 3 0 0 1 0 5.6M18 14.3c1.8.7 3 2.4 3 4.7"/>',
  mail: '<rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="m3.5 7 8.5 6 8.5-6"/>',
  phone: '<path d="M5 3.5h3.5l1.5 4-2 1.5a11 11 0 0 0 7 7l1.5-2 4 1.5V19a1.5 1.5 0 0 1-1.5 1.5C10.6 20.5 3.5 13.4 3.5 5A1.5 1.5 0 0 1 5 3.5z"/>',
  video: '<rect x="3" y="6.5" width="12.5" height="11" rx="2"/><path d="m15.5 10.5 5-3v9l-5-3"/>',
  doc: '<path d="M5 4.5h14v15H5z"/><path d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4"/>',
  pin: '<path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/>',
  check: '<circle cx="12" cy="12" r="8.5"/><path d="m8.2 12.2 2.6 2.6 5-5.2"/>',
  handshake: '<path d="M3 12.5 7 8.5l3 1.5 3-2 4 1 4 3.5"/><path d="M7 8.5 3.5 7M21 12.5l-3.5 3.5-2.5-1-2 2-2-1-2 1.5-3-3"/>',
  clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  lift: '<path d="M7 20.5V4M17 20.5V4M7 8h10M7 13h10"/><path d="m10 17 2-2 2 2"/>',
  shield: '<path d="M12 3.5 5 6v5.5c0 4.2 3 7.6 7 9 4-1.4 7-4.8 7-9V6z"/><path d="m9 12 2.2 2.2L15.5 10"/>',
  crown: '<path d="m4 17 1.5-9 4.5 4 2-6 2 6 4.5-4L20 17z"/><path d="M4 20h16"/>',
  spark: '<path d="M12 3.5v4M12 16.5v4M3.5 12h4M16.5 12h4M6 6l2.8 2.8M15.2 15.2 18 18M18 6l-2.8 2.8M8.8 15.2 6 18"/>',
  flag: '<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
};
const ic = (k, s = 10) => `<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24">${IC[k] || IC.check}</svg>`;
const btn = (k, t) => `<span class="m-b ${k}">${t}</span>`;
const RUIT = (style, sw) => `<svg class="m-ruit" style="${style}" viewBox="0 0 460 450"><polygon points="190,114 340,34 340,234 190,316" stroke="#00498F" stroke-width="${sw || 36}"/><polygon points="58,294 208,214 346,297 186,378" stroke="#007DC2" stroke-width="${sw || 36}"/><polygon points="268,134 422,220 422,402 268,318" stroke="#6DB23F" stroke-width="${sw || 36}"/></svg>`;
const fmt = s => s
  .replace(/"([^"]+)"/g, '<q>$1</q>')
  .replace(/\{g:([^}]+)\}/g, '<span class="sb g">$1</span>')
  .replace(/\{n:([^}]+)\}/g, '<span class="sb n">$1</span>')
  .replace(/\{o:([^}]+)\}/g, '<span class="sb o">$1</span>')
  .replace(/\{l:([^}]+)\}/g, '<span class="sb l">$1</span>')
  .replace(/\{t:([^}]+)\}/g, '<span class="sb t">$1</span>')
  .replace(/\{v\}/g, '<span class="vt">tekstvoorstel</span>')
  .replace(/\{c\}/g, '<span class="ct">controleren</span>')
  .replace(/\{a\}/g, '<span class="at">aanleveren</span>')
  ;

const EB = t => `<span class="m-eb">${t}</span>`;
const head = (eb, h2, right = '') => `<div class="m-head"><div class="m-col">${eb ? EB(eb) : ''}<div class="m-h2">${h2}</div></div>${right}</div>`;

/* ================= Mockup-bouwstenen ================= */
const MOCK = {

/* ================= Opbouw ================= */
const LOGO = '../assets/img/logo-de-bresser.png', LOGOC = '../assets/img/logo-de-bresser-compact.png';
const COVER_RUIT = '<svg class="ruit" viewBox="0 0 460 450"><polygon points="190,114 340,34 340,234 190,316" stroke="#00498F"/><polygon points="58,294 208,214 346,297 186,378" stroke="#007DC2"/><polygon points="268,134 422,220 422,402 268,318" stroke="#6DB23F"/></svg>';
const BGN = { N: 'Nachtblauw', W: 'Wit', M: 'Mist', G: 'Signaalgroen' };

function rowHTML(b, i) {
  if (b.ref) return `<div class="row" style="grid-template-columns:1fr"><div style="display:flex;align-items:center;gap:8px;padding:4px 10px;border:1px dashed #C4CCD9;border-radius:6px;font-size:7pt;color:var(--db-grijs)"><b style="color:var(--db-nachtblauw)">${b.name}</b> · globaal onderdeel, zie “Globale onderdelen”</div></div>`;
  return `<div class="row"><div><div class="rl"><span class="no">${i}</span><span class="code">${b.code}</span><span class="bn">${b.name}</span><span class="bgp"><i class="c-${b.bg}"></i>${BGN[b.bg]}</span></div><div class="frame" style="height:${b.h}px">${b.mock}</div></div>
    <ul class="spec">${b.spec.map(([k, v]) => `<li><span class="k">${k}</span><span class="v">${fmt(v)}</span></li>`).join('')}</ul></div>`;
}
function miniHTML(blocks, onSet, title) {
  let n = 0;
  return `<div class="mini"><h4>${title || 'Pagina-opbouw'}</h4><ul>${blocks.map(b => {
    if (b.ref) return `<li class="g ${onSet.has(b) ? 'on' : ''}"><i style="border-style:dashed"></i><span class="n"></span><span>${b.name}</span></li>`;
    n++; return `<li class="${onSet.has(b) ? 'on' : ''}"><i class="c-${b.bg}"></i><span class="n">${n}</span><span>${b.name}</span></li>`;
  }).join('')}</ul></div>`;
}
const sheetTop = (tab) => `<div class="sh-top"><img src="${LOGOC}" alt="De Bresser"><span class="doc"><b>Wireframes debresser.nl</b> · Merkboek v1.1</span>${tab}</div>`;
const LEG = `<span class="lg"><span class="sb g">Primaire knop</span><span class="sb n">Nachtblauwe knop</span><span class="sb o">Omlijnd</span><span class="sb l">Tekstlink →</span><span class="vt">tekstvoorstel</span><span class="at">aanleveren</span><span class="ct">controleren</span></span>`;
const foot = (n, t) => `<div class="sh-foot">${LEG}<span>Wireframe, geen definitief ontwerp · september 2026 · pagina ${n} van ${t}</span></div>`;
const introHTML = p => `<div class="page-intro"><span class="big">${p.nr.slice(1)}</span><div><h2>${p.name}</h2><span class="u">debresser.nl${p.url}</span></div><div style="display:grid;grid-template-columns:1fr 0.7fr;gap:14px"><div><small>Doel van de pagina</small><span class="v">${p.doel}</span></div><div><small>Belangrijkste actie</small><span class="v">${fmt(p.actie)}</span></div></div></div>`;
const pageTab = (p, ci, tot) => `<span class="tab"><span class="pn">${p.nr}</span><span class="nm">${p.name}</span><span class="url">${p.url}</span><span class="tpl">${p.tpl === 'Vrij' ? 'Vrije opbouw' : 'Template ' + p.tpl}</span><span class="url">vel ${ci + 1}/${tot}</span></span>`;

async function build() {
  if (document.fonts) {
    await Promise.all(['300', '400', '500', '600'].map(w => document.fonts.load(w + ' 12px Sora')).concat([document.fonts.load('400 12px "IBM Plex Mono"'), document.fonts.load('500 12px "IBM Plex Mono"')]));
    await document.fonts.ready;
  }
  const doc = document.getElementById('doc');

  /* Beschikbare hoogte meten met een proefvel */
  const probe = withIntro => {
    const s = document.createElement('section'); s.className = 'sheet';
    s.innerHTML = sheetTop(pageTab(PAGES[0], 0, 1)) + (withIntro ? introHTML(PAGES[0]) : '') + '<div class="sh-body"><div class="mini"></div><div class="rows"></div></div>' + foot(1, 1);
    doc.appendChild(s); const r = s.querySelector('.rows').getBoundingClientRect(); s.remove(); return r;
  };
  const r1 = probe(true), r2 = probe(false);
  const capFirst = r1.height - 12, capRest = r2.height - 12;

  /* Elke rij meten op dezelfde breedte */
  const meas = document.createElement('div'); meas.className = 'rows';
  meas.style.cssText = `position:absolute;left:-5000px;top:0;width:${r2.width}px`; document.body.appendChild(meas);
  const hOf = html => { meas.innerHTML = html; return meas.firstElementChild.getBoundingClientRect().height; };
  const GAP = 9;
  const paginate = (blocks, numbering, first, rest) => {
    const out = []; let cur = []; let used = 0; let cap = first;
    for (const b of blocks) {
      const h = hOf(rowHTML(b, numbering.get(b)));
      if (cur.length && used + GAP + h > cap) { out.push(cur); cur = []; used = 0; cap = rest; }
      used += (cur.length ? GAP : 0) + h; cur.push(b);
    }
    if (cur.length) out.push(cur);
    return out;
  };

  const gNum = new Map(GLOBALS.map((b, i) => [b, i + 1]));
  const globalChunks = paginate(GLOBALS, gNum, capRest, capRest);
  const pageSheets = [];
  PAGES.forEach(p => {
    const num = new Map(); let k = 0; p.blocks.forEach(b => { if (!b.ref) num.set(b, ++k); });
    const chunks = paginate(p.blocks, num, capFirst, capRest);
    chunks.forEach((ch, ci) => pageSheets.push({ p, ci, chunks, ch, num }));
  });
  meas.remove();

  const TOTAL = 2 + globalChunks.length + pageSheets.length;
  const startOf = {}; let no = 2 + globalChunks.length;
  pageSheets.forEach(s => { no++; if (s.ci === 0) startOf[s.p.nr] = no; });
  const sheets = [];

  /* 1 · Omslag */
  sheets.push(`<section class="sheet cover">${COVER_RUIT}
    <div class="cv-l"><img src="${LOGO}" alt="De Bresser"><span class="eb">Wireframes · website</span>
      <h1>Wireframes<br><span>debresser.nl</span></h1>
      <p class="lead">Per pagina alle blokken van boven naar beneden: hoe het eruitziet, wat er precies staat en welke knop waarheen leidt. Volgens Merkboek v1.1.</p>
      <div class="cv-stats"><div><b>${PAGES.length}</b><span>pagina’s</span></div><div><b>${PAGES.reduce((s, p) => s + p.blocks.filter(b => !b.ref).length, 0)}</b><span>blokken uitgewerkt</span></div><div><b>${TOTAL}</b><span>vellen</span></div></div>
      <p class="cv-meta">Voor: directie De Bresser · september 2026 · op basis van de live teksten van debresser.nl</p></div>
    <div class="toc"><h2>Inhoud</h2><ul>
      <li><span class="nr"></span><span>Zo lees je dit document</span><span></span><span class="pg">p. 2</span></li>
      <li><span class="nr">G</span><span>Globale onderdelen: utility-balk, header, mega menu, footer, mobiel</span><span></span><span class="pg">p. 3</span></li>
      ${PAGES.map(p => `<li><span class="nr">${p.nr}</span><span>${p.name} <span class="mono" style="font-size:7pt;color:var(--db-grijs)">${p.url}</span></span><span class="t">${p.tpl === 'Vrij' ? 'vrij' : p.tpl}</span><span class="pg">p. ${startOf[p.nr]}</span></li>`).join('')}
    </ul></div></section>`);

  /* 2 · Intro */
  sheets.push(INTRO(TOTAL));

  /* Globaal */
  globalChunks.forEach((ch, ci) => {
    sheets.push(`<section class="sheet">${sheetTop(`<span class="tab"><span class="pn">G</span><span class="nm">Globale onderdelen</span><span class="tpl">op elke pagina</span>${globalChunks.length > 1 ? `<span class="url">vel ${ci + 1}/${globalChunks.length}</span>` : ''}</span>`)}
      <div class="sh-body">${miniHTML(GLOBALS, new Set(ch), 'Onderdelen')}<div class="rows">${ch.map(b => rowHTML(b, gNum.get(b))).join('')}</div></div>${foot(3 + ci, TOTAL)}</section>`);
  });

  /* Pagina’s */
  let n = 2 + globalChunks.length;
  pageSheets.forEach(({ p, ci, chunks, ch, num }) => {
    n++;
    sheets.push(`<section class="sheet">${sheetTop(pageTab(p, ci, chunks.length))}${ci === 0 ? introHTML(p) : ''}
      <div class="sh-body">${miniHTML(p.blocks, new Set(ch))}<div class="rows">${ch.map(b => rowHTML(b, num.get(b))).join('')}</div></div>${foot(n, TOTAL)}</section>`);
  });

  doc.innerHTML = sheets.join('');

  /* Alleen voor controle op scherm: ?from=3&to=6 toont een deel van de vellen */
  const q = new URLSearchParams(location.search);
  if (q.get('from')) {
    const f = +q.get('from'), t = +q.get('to');
    document.querySelectorAll('.sheet').forEach((s, i) => { if (i + 1 < f || i + 1 > t) s.style.display = 'none'; });
  }
}

  <div class="intro-grid">

        <div style="background:#F6F8FB"><b>Schets van het blok</b>Het blok zoals de bezoeker het ziet, met de echte kleuren, teksten, knoppen en foto’s. Verkleind, geen definitief ontwerp.</div>
        <div style="background:#F6F8FB"><b>Specificatie</b>Per blok precies wat erin staat: layout, eyebrow, H1/H2, tekst, knoppen, beeld en regels uit het merkboek.</div>
      </div>
      <h3 style="margin-top:14px">Afspraken</h3>
      <ul class="legend">
        <li><span>Teksten</span><span>Waar mogelijk de <b>bestaande teksten</b> van debresser.nl. Nieuwe koppen en teksten zijn gemarkeerd als <span class="vt">tekstvoorstel</span>.</span></li>
        <li><span>Ontbrekende inhoud</span><span><span class="at">aanleveren</span> = De Bresser levert de tekst of het antwoord aan (bijv. FAQ over opslag).</span></li>
        <li><span>Tegenstrijdigheden</span><span><span class="ct">controleren</span> = op de huidige site staan verschillende gegevens (bijv. twee adressen Oisterwijk).</span></li>
        <li><span>Reviews</span><span>Letterlijk overgenomen van de site, inclusief typefouten van klanten.</span></li>
        <li><span>Blokcodes</span><span>B01–B22 uit de Blokkenbibliotheek; B23 Team is nieuw.</span></li>
      </ul></div>
    <div class="box"><h3>Legenda</h3><ul class="legend">
      <li><span class="sw"><i class="c-N"></i>Nachtblauw</span><span>Hero, “Met oog voor morgen”, footer</span></li>
      <li><span class="sw"><i class="c-W"></i>Wit</span><span>Inhoudsblokken (wisselt af met Mist)</span></li>
      <li><span class="sw"><i class="c-M"></i>Mist</span><span>Inhoudsblokken met kaarten</span></li>
      <li><span class="sw"><i class="c-G"></i>Signaalgroen</span><span>Alleen het afsluitende CTA-paneel</span></li>
      <li><span><span class="sb g">Offerte aanvragen</span></span><span>Primaire knop · max. één per scherm</span></li>
      <li><span><span class="sb n">Over ons</span></span><span>Knop op licht of groen vlak</span></li>
      <li><span><span class="sb o">Neem contact op</span></span><span>Secundaire, omlijnde knop</span></li>
      <li><span><span class="sb l">Lees meer →</span></span><span>Tekstlink in Webblauw</span></li>
      <li><span><span class="sb t">Nieuw!</span></span><span>Label in Kroongeel, spaarzaam</span></li>
      <li><span>Lettertype</span><span>Sora · H1 56/64 · H2 36/44 · H3 24/32 · tekst 16/28</span></li>
      <li><span>Raster</span><span>Max. 1240 px · 12 kolommen · hoeken 6 / 12 / 20 px</span></li>
    </ul></div>
  </div>
  ${foot(2, TOTAL)}</section>`;
}

build();

</script>
