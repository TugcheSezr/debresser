<!-- Kort berichtformulier onderaan de pagina (25-09-2026), zoals debresser.nl het onderaan plaats-, dienst- en
     blogpagina's had: Naam, Telefoonnummer, E-mailadres, Bericht. build_paginas.py zet het eronder (bericht_op).
     Sectiebibliotheek: form-card-crew-rise (../section-library/form-card-crew-rise), 25-09-2026 (debresser-8d). Basis is
     de formulierkaart van /contact/ (.sb-contact__formkaart: blauwe strook met een uitsnede die erbovenuit komt); hier met
     de goedgekeurde uitsnede van drie werkers en een schuin vlak achter de kaart, op een diepblauwe band. Het formulier
     zelf (velden, namen, data-attributen, versturen via site.js) is ongewijzigd; alleen de knop is groen (btn--offerte).
     De regel met telefoon en mail staat niet meer in dit blok: de sectie erboven (#afsluiting of #contact) en de
     footer hebben die al. -->
<section class="sectie sb-bericht" id="stuur-een-bericht" aria-labelledby="stuur-een-bericht-kop">
  <div class="wrap sb-bericht__rij">
    <div class="sb-bericht__tekst" data-reveal>
      <p class="label">Contact</p>
      <h2 class="kop" id="stuur-een-bericht-kop">Stuur ons een bericht</h2>
      <p class="intro">Heeft u een vraag of wilt u iets met ons overleggen? Laat uw gegevens achter, dan hoort u binnen 24 uur van ons.</p>
    </div>
    <div class="sb-bericht__kaartvak" data-reveal>
      <div class="sb-bericht__vlak" aria-hidden="true"></div>
      <div class="sb-contact__formkaart sb-bericht__kaart">
        <div class="sb-contact__beeld sb-bericht__beeld" aria-hidden="true"><img src="/assets/img/hero/drie-werkers-900.webp" srcset="/assets/img/hero/drie-werkers-900.webp 900w, /assets/img/hero/drie-werkers-1600.webp 1600w" sizes="(max-width:560px) 260px, 340px" width="900" height="519" alt="" loading="lazy" decoding="async"></div>
        <form class="sbf" id="sbf-bericht" action="https://api.web3forms.com/submit" method="POST" data-w3f data-mail="info@debresser.nl" data-bedankt="Bedankt, uw bericht is verstuurd." data-verder="Wij nemen binnen 24 uur contact met u op. Liever direct? Bel +31 (0)13 52 82 372.">
          <input type="hidden" name="access_key" value="">
          <input type="hidden" name="subject" value="Bericht via de website van De Bresser">
          <input type="hidden" name="from_name" value="De Bresser website">
          <input type="checkbox" name="botcheck" class="sb-verborgen" tabindex="-1" autocomplete="off" aria-hidden="true">
          <div class="sbf__rij"><p class="sb-veld"><label for="sbf-bericht-naam">Naam</label><input id="sbf-bericht-naam" type="text" name="Naam" required data-leeg="Vul uw naam in." autocomplete="name"></p><p class="sb-veld"><label for="sbf-bericht-telefoonnummer">Telefoonnummer</label><input id="sbf-bericht-telefoonnummer" type="tel" name="Telefoonnummer" required data-leeg="Vul uw telefoonnummer in." autocomplete="tel" inputmode="tel" pattern="[0-9+ \(\)\-]{8,}"></p></div>
          <p class="sb-veld"><label for="sbf-bericht-e-mailadres">E-mailadres</label><input id="sbf-bericht-e-mailadres" type="email" name="E-mailadres" required data-leeg="Vul uw e-mailadres in." autocomplete="email"></p>
          <p class="sb-veld"><label for="sbf-bericht-bericht">Bericht <span class="sbf__optioneel">(optioneel)</span></label><textarea id="sbf-bericht-bericht" name="Bericht" placeholder="Vragen of opmerkingen?" rows="2"></textarea></p>
          <div class="sbf__verstuur"><button class="btn btn--offerte" type="submit"><svg aria-hidden="true"><use href="#i-caret"/></svg>Bericht versturen</button><p>Door dit formulier te versturen gaat u akkoord met onze <a href="/privacyverklaring/">privacyverklaring</a>.</p></div>
          <p class="sbf__melding" id="sbf-bericht-melding" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>
  </div>
</section>
