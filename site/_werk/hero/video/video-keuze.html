<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hero-video kiezen, De Kievit</title>
<style>
  :root{--teal:#00A19B;--teal-diep:#006C68;--navy:#22314E;--creme:#F6F4EC;--lijn:#C4E4E4;--ant:#1D1D1B;--zacht:#4B4B49;--oranje:#EE7203}
  *{box-sizing:border-box}
  body{margin:0;background:var(--creme);color:var(--ant);font:15px/1.5 -apple-system,"Helvetica Neue",Arial,sans-serif}
  header.kop{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:12px 24px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
  header.kop h1{font-size:18px;margin:0}
  header.kop small{opacity:.75}
  header.kop .gekozen{margin-left:auto;background:var(--oranje);color:var(--ant);border-radius:999px;padding:8px 16px;font-weight:700}
  main{max-width:1680px;margin:0 auto;padding:24px}
  .leeg{background:#fff;border:1px dashed var(--lijn);border-radius:12px;padding:18px;color:var(--zacht)}
  .kaart{background:#fff;border:1px solid var(--lijn);border-radius:16px;padding:18px;margin-bottom:22px;display:grid;grid-template-columns:minmax(300px,440px) 1fr;gap:20px;box-shadow:0 10px 30px -24px rgba(29,29,27,.4)}
  .kaart.is-gekozen{outline:3px solid var(--oranje)}
  .nr{display:inline-flex;align-items:center;justify-content:center;min-width:56px;height:56px;padding:0 14px;border-radius:14px;background:var(--teal);color:#fff;font-size:26px;font-weight:800}
  .meta{display:grid;gap:10px;align-content:start}
  .meta .rij{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .meta video{display:block;width:100%;border-radius:10px;background:#000}
  .meta dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14px}
  .meta dt{color:var(--zacht)}
  .meta dd{margin:0;overflow-wrap:anywhere}
  .meta ol{margin:0;padding-left:18px;font-size:14px}
  .meta .opm{background:#FFF6EC;border-left:3px solid var(--oranje);padding:8px 10px;border-radius:6px;font-size:14px}
  button.kies{background:var(--oranje);color:var(--ant);border:0;border-radius:999px;padding:12px 20px;font-weight:700;font-size:15px;cursor:pointer}
  button.kies:hover{background:#D9660A}
  .previews{display:grid;grid-template-columns:1fr auto;gap:16px;align-content:start}
  .pv{background:#e9e7df;border-radius:12px;overflow:hidden;position:relative}
  .pv .lbl{position:absolute;left:10px;top:8px;z-index:2;background:rgba(34,49,78,.85);color:#fff;font-size:12px;padding:3px 8px;border-radius:999px}
  .pv--desk{width:100%;aspect-ratio:1440/960}
  .pv--desk iframe{width:1440px;height:960px;border:0;transform-origin:0 0}
  .pv--mob{width:234px;aspect-ratio:390/1000}
  .pv--mob iframe{width:390px;height:1000px;border:0;transform:scale(.6);transform-origin:0 0}
  .opties{grid-column:1/-1;display:flex;gap:18px;flex-wrap:wrap;font-size:14px;align-items:center}
  .opties label{display:inline-flex;align-items:center;gap:6px}
  @media(max-width:1100px){.kaart{grid-template-columns:1fr}.previews{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="kop">
  <h1>Hero-video kiezen</h1>
  <small>Previews: de echte hero (hero-preview.html + style.css) met de video als achtergrond in plaats van de foto; figuur en tekst blijven staan. Het schuifje van de hero-figuur zit op de andere keuzepagina.</small>
  <span class="gekozen" id="gekozen">Nog niets gekozen</span>
</header>
<main>
  <div id="lijst" class="leeg">Laden...</div>
</main>
<script>
(function(){
  function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function previewUrl(k, figuur){
    var q = new URLSearchParams({video: k.mp4, poster: k.poster || ''});
    if(k.webm) q.set('webm', k.webm); if(k.pos) q.set('pos', k.pos); if(!figuur) q.set('figuur','0');
    return '../hero-preview.html?' + q.toString();
  }
  function kaart(k){
    var el = document.createElement('article'); el.className = 'kaart';
    el.innerHTML =
      '<div class="meta">' +
        '<div class="rij"><span class="nr">' + esc(k.id) + '</span><button class="kies" type="button">Gekozen: ' + esc(k.id) + '</button></div>' +
        '<video controls muted loop playsinline preload="metadata" poster="' + esc(k.poster||'') + '"><source src="' + esc(k.mp4) + '" type="video/mp4"></video>' +
        '<dl><dt>Bron</dt><dd>' + esc(k.bron) + '</dd><dt>Bestand</dt><dd>' + esc(k.mp4) + (k.mp4mobiel ? '<br>' + esc(k.mp4mobiel) : '') + '</dd><dt>Lengte</dt><dd>' + esc(k.lengte) + '</dd><dt>Grootte</dt><dd>' + esc(k.grootte) + '</dd></dl>' +
        (k.shots ? '<ol>' + k.shots.map(function(s){ return '<li>' + esc(s) + '</li>'; }).join('') + '</ol>' : '') +
        (k.opmerking ? '<div class="opm">' + esc(k.opmerking) + '</div>' : '') +
      '</div>' +
      '<div class="previews">' +
        '<div class="pv pv--desk"><span class="lbl">1440 px</span><iframe loading="lazy" title="Preview 1440" src="' + esc(previewUrl(k, true)) + '"></iframe></div>' +
        '<div class="pv pv--mob"><span class="lbl">390 px</span><iframe loading="lazy" title="Preview 390" src="' + esc(previewUrl(k, true)) + '"></iframe></div>' +
        '<div class="opties"><label><input type="checkbox" class="fig" checked> figuur (cutout) tonen in de preview</label><span>Op mobiel hoort straks alleen de poster of de 1280-versie te laden; dit is een beoordelingspreview.</span></div>' +
      '</div>';
    var frames = el.querySelectorAll('iframe');
    el.querySelector('.fig').addEventListener('change', function(e){ frames.forEach(function(f){ f.src = previewUrl(k, e.target.checked); }); });
    el.querySelector('.kies').addEventListener('click', function(){
      document.querySelectorAll('.kaart.is-gekozen').forEach(function(x){ x.classList.remove('is-gekozen'); });
      el.classList.add('is-gekozen'); document.getElementById('gekozen').textContent = 'Gekozen: ' + k.id;
      try{ localStorage.setItem('hero-video-keuze', k.id); }catch(e){}
    });
    return el;
  }
  function schaal(){ document.querySelectorAll('.pv--desk').forEach(function(pv){ pv.querySelector('iframe').style.transform = 'scale(' + (pv.clientWidth / 1440) + ')'; }); }
  var houder = document.getElementById('lijst');
  fetch('kandidaten.json', {cache:'no-store'}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }).then(function(lijst){
    houder.className = ''; houder.innerHTML = '';
    if(!lijst.length){ houder.className='leeg'; houder.textContent='Nog geen kandidaten.'; return; }
    lijst.forEach(function(k){ houder.appendChild(kaart(k)); }); schaal();
  }).catch(function(e){ houder.className='leeg'; houder.textContent='Nog geen kandidaten (kandidaten.json ontbreekt: ' + e.message + ').'; });
  window.addEventListener('resize', schaal);
  try{ var v = localStorage.getItem('hero-video-keuze'); if(v) document.getElementById('gekozen').textContent = 'Eerder gekozen: ' + v; }catch(e){}
})();
</script>
</body>
</html>
